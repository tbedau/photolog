<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tillmann Bedau — Photolog{% endblock %}</title>
    <meta name="description" content="A daily photo log by Tillmann Bedau." />
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Photolog" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
</head>
<body{% block body_attrs %}{% endblock %}>
    {% block header %}{% include "partials/header.html" %}{% endblock %}
    {% block content %}{% endblock %}
</body>
</html>
