{% extends "base.html" %}

{% block title %}Sign in — Photolog{% endblock %}

{% block head_extra %}
{# Only the auth surfaces use hx-* attributes; loading htmx here instead of in
   base.html keeps it off the public pages. #}
<script src="/static/js/htmx-2.0.3.min.js" defer></script>
{% endblock %}

{% block content %}
<div class="auth">
    <form method="POST" action="/token" class="auth__form" hx-post="/token" hx-target="#error-container" hx-swap="innerHTML">
        <input type="text" id="username" name="username" placeholder="Username" required class="auth__input" autocomplete="username">
        <input type="password" id="password" name="password" placeholder="Password" required class="auth__input" autocomplete="current-password">
        <button type="submit" class="auth__button">Sign in</button>
    </form>
    <div id="error-container" class="error-container"></div>

    <p class="auth__footer"><a href="/">Back to Photolog</a></p>
</div>
{% endblock %}
