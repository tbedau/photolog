{% extends "base.html" %}

{% block title %}Upload — Photolog{% endblock %}

{% block head_extra %}
<script src="/static/js/auth.js" nonce="{{ request.state.csp_nonce }}" defer></script>
{% endblock %}

{% block content %}
<div class="auth">
    <div id="drop-area" class="auth__drop" data-state="idle">
        <p class="auth__drop-text" data-role="prompt">Drag &amp; drop or</p>
        <p class="auth__drop-text auth__drop-filename" data-role="filename" hidden></p>

        <form id="upload-form" enctype="multipart/form-data" action="/upload" method="post">
            <input type="file" id="file-input" name="file" accept=".jpg,.jpeg,.png,.tiff" hidden>
            <button type="button" class="auth__button" data-role="select">Select</button>
        </form>

        <ul class="upload-checklist" data-role="checklist" hidden>
            <li class="upload-step" data-step="upload" data-state="pending">
                <span class="upload-step__icon" aria-hidden="true"></span>
                <span class="upload-step__label">Uploading</span>
            </li>
            <li class="upload-step" data-step="decode" data-state="pending">
                <span class="upload-step__icon" aria-hidden="true"></span>
                <span class="upload-step__label">Reading image</span>
            </li>
            <li class="upload-step" data-step="original" data-state="pending">
                <span class="upload-step__icon" aria-hidden="true"></span>
                <span class="upload-step__label">Saving master</span>
            </li>
            <li class="upload-step" data-step="avif" data-state="pending">
                <span class="upload-step__icon" aria-hidden="true"></span>
                <span class="upload-step__label">Encoding AVIF</span>
                <span class="upload-substeps" data-role="avif-widths"></span>
            </li>
            <li class="upload-step" data-step="jpeg" data-state="pending">
                <span class="upload-step__icon" aria-hidden="true"></span>
                <span class="upload-step__label">Encoding JPEG fallbacks</span>
                <span class="upload-substeps" data-role="jpeg-widths"></span>
            </li>
            <li class="upload-step" data-step="commit" data-state="pending">
                <span class="upload-step__icon" aria-hidden="true"></span>
                <span class="upload-step__label">Saving to library</span>
            </li>
        </ul>

        <button type="button" class="auth__link-button upload-retry" data-role="retry" hidden>Try another</button>
    </div>

    <div id="error-container" class="error-container" aria-live="polite"></div>

    <form method="POST" action="/logout" class="auth__footer">
        <button type="submit" class="auth__link-button">Log out</button>
    </form>
</div>
{% endblock %}
