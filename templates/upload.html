{% extends "base.html" %}

{% block title %}Upload — Photolog{% endblock %}

{% block head_extra %}
<script src="/static/js/htmx-2.0.3.min.js" nonce="{{ request.state.csp_nonce }}" defer></script>
<script src="/static/js/upload-dropzone.js" nonce="{{ request.state.csp_nonce }}" defer></script>
{% endblock %}

{% block content %}
<div class="auth">
    <div id="drop-area" class="auth__drop">
        <p class="auth__drop-text">Drag &amp; drop or</p>
        <form id="upload-form" hx-encoding="multipart/form-data" hx-post="/upload" hx-target="#error-container">
            <input type="file" id="file-input" name="file" accept=".jpg,.jpeg,.png,.tiff" required hidden>
            <button type="button" class="auth__button">Select</button>
        </form>
    </div>

    <div id="error-container" class="error-container"></div>

    <form method="POST" action="/logout" class="auth__footer">
        <button type="submit" class="auth__link-button">Log out</button>
    </form>
</div>
{% endblock %}
